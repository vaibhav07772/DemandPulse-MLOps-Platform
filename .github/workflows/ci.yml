name: CI

on:
  push:
    branches: [main, mlops-dev, develop]
  pull_request:
    branches: [main, mlops-dev, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  MLFLOW_ENABLED: "false"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff==0.8.4

      - name: Run Ruff
        run: ruff check app tests

      - name: Run Ruff format check
        run: ruff format --check app tests

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          MLFLOW_ENABLED: "false"
        run: pytest -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t demandpulse-ai-mlops:ci .

      - name: Smoke test container
        run: |
          docker run -d --name dpx -p 8000:8000 -e MLFLOW_ENABLED=false demandpulse-ai-mlops:ci
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "Health OK"
              docker stop dpx
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs dpx
          docker stop dpx
          exit 1
